
server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

spring:
  profiles:
    active: dev
  application:
    name: service-oauth2
  security:
    user:
      name: user
      password: password
    oauth2:
      authorizationserver:
        client:
          gateway:
            registration:
              client-id: "oidc-client"
              client-secret: "{noop}secret"
              client-authentication-methods:
                - "client_secret_post"
                - "client_secret_basic"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
              redirect-uris:
                - "http://127.0.0.1/login/oauth2/code/gateway"
              post-logout-redirect-uris:
                - "http://127.0.0.1/"
              scopes:
                - "openid"
                - "profile"
                - "user"
            require-authorization-consent: true
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        import-check:
          enabled: false
      discovery:
        namespace: ${spring.profiles.active}