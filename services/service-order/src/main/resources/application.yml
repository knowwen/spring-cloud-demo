server:
  port: 8084

spring:
  profiles:
    active: dev
  application:
    name: service-order
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      config:
        namespace: ${spring.profiles.active}
      discovery:
        namespace: ${spring.profiles.active}
---
spring:
  config:
    import:
      # - nacos:db.yml
      - nacos:service-order-db.yml
    activate:
      on-profile:
      - dev
---
spring:
  config:
    import:
    - nacos:db.yml
    activate:
      on-profile:
      - test
---
spring:
  config:
    import:
    - nacos:db.yml
    activate:
      on-profile:
      - prod
