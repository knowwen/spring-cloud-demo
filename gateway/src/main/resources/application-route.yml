spring:
  cloud:
    gateway:
      routes:
      - id: sharding-route
        uri: lb://service-sharding
        predicates:
        - Path=/api/sharding/**
        filters:
        - StripPrefix=2
        - TokenRelay
      - id: user-read-write-route
        uri: lb://service-user-read-write
        predicates:
        - Path=/api/user/**
        filters:
        - StripPrefix=2
        - TokenRelay
      - id: account-route
        uri: lb://service-account
        predicates:
        - Path=/api/account/**
        filters:
        - StripPrefix=2
        - TokenRelay
      - id: order-route
        uri: lb://service-order
        predicates:
        - Path=/api/order/**
        filters:
        - StripPrefix=2
        - TokenRelay
      - id: product-route
        uri: lb://service-product
        predicates:
        - Path=/api/product/**
        filters:
        - StripPrefix=2
      - id: oauth2-route
        uri: lb://service-oauth2
        predicates:
        - Path=/api/oauth2/**
        filters:
        - StripPrefix=2